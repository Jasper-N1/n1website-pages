<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinician image shortlist — n1.care</title>
<style>
:root{--paper:#f7f4ed;--ink:#171817;--teal:#62cbc5;--line:#cbc7be;--serif:Georgia,"Times New Roman",serif;--sans:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans)}.head,main{width:min(1320px,calc(100% - 48px));margin:auto}.head{padding:58px 0 40px}.head a,.meta a{color:#315f5b}.head a{font-size:13px;font-weight:700;text-decoration:none}.head h1{max-width:900px;margin:30px 0 14px;font:400 clamp(42px,6vw,74px)/1 var(--serif);letter-spacing:-.04em}.head p{max-width:760px;margin:0;color:#65706c;font-size:16px;line-height:1.6}.option{margin-bottom:58px}.meta{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.meta div{display:flex;align-items:baseline;gap:14px}.meta b{font:400 28px/1 var(--serif)}.meta span{color:#53716d;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.meta a{font-size:12px}.scene{min-height:clamp(500px,58vw,760px);position:relative;overflow:hidden;border-radius:28px;background:#24332f}.scene img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;filter:saturate(.78) contrast(1.03)}.scene:after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,16,.92),rgba(10,18,16,.66) 32%,rgba(10,18,16,.13) 70%),linear-gradient(0deg,rgba(10,18,16,.36),transparent 60%);content:""}.copy{max-width:600px;position:absolute;z-index:1;bottom:clamp(40px,7vw,90px);left:clamp(28px,7vw,92px);color:white}.copy small{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.copy h2{margin:20px 0 0;font:400 clamp(42px,5.4vw,74px)/1 var(--serif);letter-spacing:-.04em}.copy p{max-width:550px;margin:22px 0 0;color:#ffffffe0;font-size:17px;line-height:1.55}.note{margin:12px 4px 0;color:#626b67;font-size:13px;line-height:1.5}main{padding-bottom:80px}@media(max-width:700px){.head,main{width:calc(100% - 24px)}.head{padding-top:34px}.meta{align-items:flex-start;flex-direction:column;gap:8px}.scene{min-height:680px;border-radius:20px}.copy{right:22px;bottom:44px;left:22px}.copy h2{font-size:45px}}
</style>
</head>
<body>
<header class="head"><a href="clinicians.html">← Back to the clinician page</a><h1>Ten natural care options.</h1><p>A tighter shortlist for image 3. Every option excludes visible stethoscopes, surgery, operating rooms, and posed white-coat portraits. These lean toward consultation, listening, and personal care.</p></header>
<main id="options"></main>
<script>
const options=[
[1,14797777,'Quiet one-to-one consultation','Natural listening posture and a calm, non-clinical room.'],
[2,3958372,'Care conversation at home','Warm and personal, with the practitioner actively listening.'],
[3,4098368,'Private consultation with notes','A credible working moment with useful negative space.'],
[4,4098374,'Patient-led conversation','Feels observed rather than posed and keeps attention on the exchange.'],
[5,5217840,'Small-group consultation','Shows collaborative care without relying on medical props.'],
[6,5699481,'Clinician listening across a table','Simple, quiet, and focused on the person rather than the setting.'],
[7,5816300,'Health consultation at a table','A practical conversation with documents present but not dominant.'],
[8,6255882,'Supportive conversation with an older adult','Human and attentive, with a stronger personal-care emphasis.'],
[9,7222093,'Collaborative care discussion','A wider setup that suggests shared decision-making.'],
[10,9064300,'Nutrition-focused consultation','Bright, contemporary, and clearly centered on practical health guidance.']
];
document.querySelector('#options').innerHTML=options.map(([n,id,label,note])=>`<section class="option"><div class="meta"><div><b>${String(n).padStart(2,'0')}</b><span>${label}</span></div><a href="https://www.pexels.com/photo/${id}/" target="_blank" rel="noopener">Pexels source ↗</a></div><div class="scene"><img src="https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1800" alt="${label}" ${n>2?'loading="lazy"':''}><div class="copy"><small>Stay present</small><h2>More time for the work only you can do.</h2><p>Spend less time piecing together the record and more time discussing what matters with the patient.</p></div></div><p class="note">${note}</p></section>`).join('');
</script>
</body>
</html>
