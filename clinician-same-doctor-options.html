<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Same doctor image options — n1.care</title>
<style>
:root{--paper:#f7f4ed;--ink:#171817;--teal:#62cbc5;--serif:Georgia,"Times New Roman",serif;--sans:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans)}.head,main{width:min(1320px,calc(100% - 48px));margin:auto}.head{padding:58px 0 40px}.head a,.meta a{color:#315f5b}.head a{font-size:13px;font-weight:700;text-decoration:none}.head h1{max-width:900px;margin:30px 0 14px;font:400 clamp(42px,6vw,74px)/1 var(--serif);letter-spacing:-.04em}.head p{max-width:820px;margin:0;color:#65706c;font-size:16px;line-height:1.6}.option{margin-bottom:58px}.meta{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.meta div{display:flex;align-items:baseline;gap:14px}.meta b{font:400 28px/1 var(--serif)}.meta span{color:#53716d;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.meta a{font-size:12px}.scene{height:clamp(560px,58vw,760px);position:relative;overflow:hidden;border-radius:28px;background:#1d2825}.scene img{width:var(--image-width,100%);height:100%;position:absolute;top:0;right:0;bottom:0;object-fit:cover;object-position:var(--position);filter:saturate(.78) contrast(1.03)}.scene:after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,16,.96),rgba(10,18,16,.82) 31%,rgba(10,18,16,.24) 55%,rgba(10,18,16,.05) 76%),linear-gradient(0deg,rgba(10,18,16,.32),transparent 60%);content:""}.copy{max-width:600px;position:absolute;z-index:1;bottom:clamp(40px,7vw,90px);left:clamp(28px,7vw,92px);color:white}.copy small{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.copy h2{margin:20px 0 0;font:400 clamp(42px,5.4vw,74px)/1 var(--serif);letter-spacing:-.04em}.copy p{max-width:550px;margin:22px 0 0;color:#ffffffe0;font-size:17px;line-height:1.55}.note{margin:12px 4px 0;color:#626b67;font-size:13px;line-height:1.5}main{padding-bottom:80px}@media(max-width:700px){.head,main{width:calc(100% - 24px)}.head{padding-top:34px}.meta{align-items:flex-start;flex-direction:column;gap:8px}.scene{height:680px;border-radius:20px}.scene img{width:100%;object-position:var(--mobile-position,var(--position))}.copy{right:22px;bottom:44px;left:22px}.copy h2{font-size:45px}}
</style>
</head>
<body>
<header class="head"><a href="clinicians.html">← Back to the clinician page</a><h1>Ten treatments of the same doctor.</h1><p>Five suitable source frames from the original cottonbro studio shoot, each shown with a wide and tighter crop. She is looking toward the patient in every selection; the physical chart is not the focus.</p></header>
<main id="options"></main>
<script>
const options=[
[1,7579823,'Listening — wide','52% 48%','100%','54% 48%','The calmest and most credible listening moment.'],
[2,7579823,'Listening — close','60% 46%','100%','58% 46%','More emphasis on her expression while retaining the patient.'],
[3,7578806,'Warm response — wide','50% 42%','68%','58% 42%','Direct patient engagement with her full face and posture visible.'],
[4,7578806,'Warm response — extended','50% 50%','100%','58% 50%','The portrait has been naturally extended into a complete landscape consultation scene.'],
[5,7578810,'Attentive profile — wide','50% 38%','68%','58% 38%','Neutral, considered expression with room around her head and shoulders.'],
[6,7578810,'Attentive profile — close','50% 34%','58%','62% 34%','A quieter portrait treatment with the full face retained.'],
[7,7578811,'Conversation — wide','50% 40%','68%','58% 40%','Open expression with her hands and seated posture still in frame.'],
[8,7578811,'Conversation — close','50% 35%','58%','62% 35%','Brings the expression forward without cutting through her face.'],
[9,7579831,'Positive consultation — wide','58% 46%','100%','58% 46%','Shows both doctor and patient in an upbeat exchange.'],
[10,7579831,'Positive consultation — close','65% 44%','100%','62% 44%','A tighter conversational crop with her gaze clearly raised.']
];
document.querySelector('#options').innerHTML=options.map(([n,id,label,position,width,mobilePosition,note])=>{const image=n===4?'assets/clinician-doctor-warm-response-outpaint.webp':`https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1800`;return `<section class="option"><div class="meta"><div><b>${String(n).padStart(2,'0')}</b><span>${label}</span></div><a href="https://www.pexels.com/photo/${id}/" target="_blank" rel="noopener">Pexels source ↗</a></div><div class="scene" style="--position:${position};--image-width:${width};--mobile-position:${mobilePosition}"><img src="${image}" alt="${label}" ${n>2?'loading="lazy"':''}><div class="copy"><small>Check the evidence</small><h2>Review every finding with confidence.</h2><p>Open the original file and page behind each claim, then edit anything that needs clinical judgment.</p></div></div><p class="note">${note}</p></section>`}).join('');
</script>
</body>
</html>
