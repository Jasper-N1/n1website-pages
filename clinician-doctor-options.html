<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor image shortlist — n1.care</title>
<style>
:root{--paper:#f7f4ed;--ink:#171817;--teal:#62cbc5;--line:#cbc7be;--serif:Georgia,"Times New Roman",serif;--sans:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans)}.head,main{width:min(1320px,calc(100% - 48px));margin:auto}.head{padding:58px 0 40px}.head a,.meta a{color:#315f5b}.head a{font-size:13px;font-weight:700;text-decoration:none}.head h1{max-width:900px;margin:30px 0 14px;font:400 clamp(42px,6vw,74px)/1 var(--serif);letter-spacing:-.04em}.head p{max-width:790px;margin:0;color:#65706c;font-size:16px;line-height:1.6}.option{margin-bottom:58px}.meta{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.meta div{display:flex;align-items:baseline;gap:14px}.meta b{font:400 28px/1 var(--serif)}.meta span{color:#53716d;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.meta a{font-size:12px}.scene{min-height:clamp(500px,58vw,760px);position:relative;overflow:hidden;border-radius:28px;background:#24332f}.scene img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;filter:saturate(.78) contrast(1.03)}.scene:after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,16,.92),rgba(10,18,16,.66) 32%,rgba(10,18,16,.13) 70%),linear-gradient(0deg,rgba(10,18,16,.36),transparent 60%);content:""}.copy{max-width:600px;position:absolute;z-index:1;bottom:clamp(40px,7vw,90px);left:clamp(28px,7vw,92px);color:white}.copy small{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.copy h2{margin:20px 0 0;font:400 clamp(42px,5.4vw,74px)/1 var(--serif);letter-spacing:-.04em}.copy p{max-width:550px;margin:22px 0 0;color:#ffffffe0;font-size:17px;line-height:1.55}.note{margin:12px 4px 0;color:#626b67;font-size:13px;line-height:1.5}main{padding-bottom:80px}@media(max-width:700px){.head,main{width:calc(100% - 24px)}.head{padding-top:34px}.meta{align-items:flex-start;flex-direction:column;gap:8px}.scene{min-height:680px;border-radius:20px}.copy{right:22px;bottom:44px;left:22px}.copy h2{font-size:45px}}
</style>
</head>
<body>
<header class="head"><a href="clinicians.html">← Back to the clinician page</a><h1>Ten credible doctor options.</h1><p>Clinicians in real working moments: reviewing information, listening, or talking with a patient. No operating rooms, no surgical scenes, and no stethoscope-led visual shorthand.</p></header>
<main id="options"></main>
<script>
const options=[
[1,7108327,'Conversation across the desk','A clear doctor–patient exchange with both people visible.'],
[2,16204144,'Reviewing a document','Quiet, focused work with a recognizable clinician and useful negative space.'],
[3,4266940,'Consultation in scrubs','A doctor is clearly present, but the scene remains conversational rather than staged.'],
[4,6235010,'Clinician at a workstation','A composed doctor portrait grounded in an everyday working environment.'],
[5,6129037,'Reviewing information at a desk','Documentary framing, clear clinical identity, and no medical prop as the focal point.'],
[6,6129142,'Working through the record together','A natural collaborative moment around a computer.'],
[7,6129159,'Care-team conversation','An active discussion rather than a posed portrait.'],
[8,6129147,'Clinical handover','A wider team setting with visible faces and a practical working tone.'],
[9,5998474,'Doctor listening at a desk','A simple office consultation centered on attention and communication.'],
[10,7578803,'Discussing results together','A bright, contemporary consultation with the patient included in the frame.']
];
document.querySelector('#options').innerHTML=options.map(([n,id,label,note])=>`<section class="option"><div class="meta"><div><b>${String(n).padStart(2,'0')}</b><span>${label}</span></div><a href="https://www.pexels.com/photo/${id}/" target="_blank" rel="noopener">Pexels source ↗</a></div><div class="scene"><img src="https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1800" alt="${label}" ${n>2?'loading="lazy"':''}><div class="copy"><small>See the whole record</small><h2>One complete view of the patient’s history.</h2><p>Years of reports, results, notes, medicines, and genetics become one organized, source-linked record.</p></div></div><p class="note">${note}</p></section>`).join('');
</script>
</body>
</html>
