<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>n1.care — Header concept 04</title>
  <link rel="preload" as="image" href="assets/where-did-this-come-from-v2.webp" fetchpriority="high">
  <style>
    @font-face { font-family:"Inter"; src:url("assets/fonts/inter-400.woff2") format("woff2"); font-weight:400; font-display:swap; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#fff; font-family:"Inter",Arial,sans-serif; }
    .exam-hero { height:340svh; position:relative; background:#fff; }
    .exam-hero__stage { height:100svh; position:sticky; top:0; display:grid; overflow:hidden; isolation:isolate; background:#121917; }
    .exam-hero__stage > img { width:100%; height:100%; position:absolute; z-index:-4; inset:0; object-fit:cover; object-position:center 42%; image-rendering:auto; filter:brightness(calc(1 + var(--exposure,0) * 1.35)) contrast(calc(1 - var(--exposure,0) * .38)) saturate(calc(1 - var(--exposure,0) * .7)); transform:scale(calc(1 + var(--exam-progress,0) * .018)); transform-origin:31.8% 51%; }
    .exam-hero__stage::before { position:absolute; z-index:-3; inset:0; background:linear-gradient(90deg,rgba(9,18,17,.72) 0%,rgba(9,18,17,.24) 31%,transparent 54%); opacity:calc(1 - var(--exam-progress,0)); content:""; }
    .exam-hero__stage::after { position:absolute; z-index:-2; inset:0; background:linear-gradient(0deg,rgba(7,13,12,.36),transparent 38%); opacity:calc(1 - var(--exam-progress,0)); content:""; }
    .exam-hero__light { width:96px; height:96px; position:absolute; z-index:1; top:51%; left:31.8%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,1) 0 6%,rgba(255,253,239,.98) 12%,rgba(255,248,218,.74) 28%,rgba(255,255,255,.34) 48%,rgba(255,255,255,0) 74%); mix-blend-mode:screen; filter:blur(calc(1px + var(--exam-progress,0) * 5px)); opacity:var(--light-opacity,0); transform:translate(-50%,-50%) scale(var(--light-scale,1)); transform-origin:center; will-change:transform,filter,opacity; }
    .exam-hero__light::after { position:absolute; inset:36%; border-radius:50%; background:#fff; box-shadow:0 0 16px 5px rgba(255,252,225,.95),0 0 42px 16px rgba(255,246,198,.58); content:""; }
    .exam-hero__wash { position:absolute; z-index:1; inset:0; background:#fff; opacity:var(--wash-progress,0); }
    .exam-hero__copy { width:min(590px,42vw); align-self:end; margin:0 0 clamp(64px,9vh,112px) clamp(38px,6vw,104px); color:#f3eee5; }
    .exam-hero__copy h1 { max-width:8.6ch; margin:0; font:400 clamp(58px,6.1vw,102px)/.91 "Inter",Arial,sans-serif; letter-spacing:-.065em; text-wrap:balance; opacity:calc(1 - clamp(0,calc(var(--exam-progress,0) * 2.4),1)); transform:translateY(calc(var(--exam-progress,0) * -18px)); }
    .exam-hero__payoff { position:absolute; z-index:2; inset:0; display:grid; place-items:center; padding:24px; color:#172826; opacity:var(--lookup-opacity,0); transform:translateY(calc((1 - var(--lookup-opacity,0)) * 18px)); }
    .exam-hero__payoff p { margin:0; font:400 clamp(64px,8vw,132px)/.9 "Inter",Arial,sans-serif; letter-spacing:-.07em; }
    .exam-hero__proof { position:absolute; z-index:3; inset:0; display:grid; place-content:center; padding:clamp(28px,6vw,96px); color:#172826; opacity:var(--proof-opacity,0); transform:translateY(calc((1 - var(--proof-opacity,0)) * 14px)); text-align:center; }
    .exam-hero__proof span { margin:0 0 20px; font-size:clamp(11px,1vw,15px); letter-spacing:.2em; text-transform:uppercase; }
    .exam-hero__proof p { max-width:11ch; margin:0 auto; font:400 clamp(56px,7.2vw,116px)/.92 "Inter",Arial,sans-serif; letter-spacing:-.068em; text-wrap:balance; }
    @media (max-width:760px) {
      .exam-hero { height:310svh; }
      .exam-hero__stage > img { object-fit:cover; object-position:58% center; transform:scale(calc(1 + var(--exam-progress,0) * .012)); }
      .exam-hero__stage::before { background:linear-gradient(0deg,rgba(9,18,17,.82) 0%,rgba(9,18,17,.12) 56%,transparent 74%); }
      .exam-hero__light { left:22%; }
      .exam-hero__copy { width:auto; margin:0; padding:0 24px 48px; }
      .exam-hero__copy h1 { max-width:9ch; font-size:clamp(48px,13vw,68px); }
      .exam-hero__payoff p { font-size:clamp(58px,17vw,88px); }
      .exam-hero__proof span { margin-bottom:16px; }
      .exam-hero__proof p { max-width:10ch; font-size:clamp(50px,14.5vw,76px); }
    }
    @media (prefers-reduced-motion:reduce) {
      .exam-hero { height:100svh; }
      .exam-hero__stage { background:#fff; }
      .exam-hero__stage > img,.exam-hero__stage::before,.exam-hero__stage::after,.exam-hero__copy,.exam-hero__light { display:none; }
      .exam-hero__wash { opacity:1; }
      .exam-hero__payoff { display:none; }
      .exam-hero__proof { opacity:1; transform:none; }
    }
  </style>
</head>
<body>
  <header class="exam-hero" data-exam-hero>
    <div class="exam-hero__stage">
      <img src="assets/where-did-this-come-from-v2.webp" alt="A calm doctor examining a patient with a penlight" width="1504" height="1046" loading="eager" fetchpriority="high" decoding="async">
      <div class="exam-hero__copy">
        <h1>Where did this come from?</h1>
      </div>
      <div class="exam-hero__light" aria-hidden="true"></div>
      <div class="exam-hero__wash" aria-hidden="true"></div>
      <div class="exam-hero__payoff"><p>Look it up.</p></div>
      <div class="exam-hero__proof"><span>Healthcare AI</span><p>Every answer. Right back to the source.</p></div>
    </div>
  </header>
  <script>
    (() => {
      const hero=document.querySelector('[data-exam-hero]');
      if(!hero || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      let frame=0;
      const render=()=>{
        const rect=hero.getBoundingClientRect();
        const distance=Math.max(1,hero.offsetHeight-innerHeight);
        const progress=Math.min(1,Math.max(0,-rect.top/distance));
        const light=Math.min(1,Math.max(0,(progress-.12)/.62));
        const exposure=Math.min(1,Math.max(0,(progress-.34)/.48));
        const wash=Math.min(1,Math.max(0,(progress-.62)/.22));
        const lookupIn=Math.min(1,Math.max(0,(progress-.7)/.1));
        const lookupOut=1-Math.min(1,Math.max(0,(progress-.82)/.14));
        const proof=Math.min(1,Math.max(0,(progress-.86)/.14));
        hero.style.setProperty('--exam-progress',progress.toFixed(4));
        hero.style.setProperty('--light-scale',(1+light*42).toFixed(3));
        hero.style.setProperty('--light-opacity',Math.min(1,light*2.4).toFixed(3));
        hero.style.setProperty('--exposure',exposure.toFixed(3));
        hero.style.setProperty('--wash-progress',wash.toFixed(3));
        hero.style.setProperty('--lookup-opacity',Math.min(lookupIn,lookupOut).toFixed(3));
        hero.style.setProperty('--proof-opacity',proof.toFixed(3));
        frame=0;
      };
      const requestRender=()=>{ if(!frame) frame=requestAnimationFrame(render); };
      addEventListener('scroll',requestRender,{passive:true});
      addEventListener('resize',requestRender);
      render();
    })();
  </script>
</body>
</html>
