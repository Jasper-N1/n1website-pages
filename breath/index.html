<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>n1.care — Header concept 01</title>
  <link rel="preload" as="image" href="assets/held-breath-header-v4.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/held-breath-release.webp">
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #111; font-family: "Inter", Arial, sans-serif; }

    .breath-hero { height: 185svh; position: relative; background: #111; }
    .breath-hero__stage { height: 100svh; position: sticky; top: 0; display: grid; align-items: start; overflow: hidden; isolation: isolate; }
    .breath-hero__stage > img { width: 100%; height: 100%; position: absolute; z-index: -1; inset: 0; object-fit: cover; object-position: center; transform: scale(calc(1 + var(--hero-progress,0) * .012)); transform-origin: 40% 50%; will-change: transform; }
    .breath-hero__image--ready { opacity: calc(1 - clamp(0,calc((var(--hero-progress,0) - .18) * 2.8),1)); }
    .breath-hero__image--release { width:103%; inset:0 auto 0 -3%; opacity: clamp(0,calc((var(--hero-progress,0) - .24) * 2.8),1); object-position: center 44%; }
    .breath-hero__copy { width: min(540px,39vw); align-self: start; margin-top: clamp(132px,17vh,190px); margin-right: clamp(38px,6.5vw,112px); margin-left: auto; color: #f3ede2; }
    .breath-hero__copy h1 { display: grid; margin: 0; font: inherit; }
    .breath-hero__line { max-width: 540px; grid-column: 1; grid-row: 1; font-size: clamp(42px,4.5vw,70px); font-weight: 400; line-height: .98; letter-spacing: -.055em; text-wrap: balance; will-change: opacity,transform; }
    .breath-hero__line:first-child { opacity: calc(1 - min(1,var(--hero-progress,0) * 2.55)); transform: translateY(calc(var(--hero-progress,0) * -18px)); }
    .breath-hero__line:last-child { opacity: clamp(0,calc((var(--hero-progress,0) - .46) * 3.2),1); transform: translateY(calc((1 - clamp(0,calc((var(--hero-progress,0) - .46) * 3.2),1)) * 18px)); }
    .breath-hero__emphasis { text-decoration:underline; text-decoration-thickness:.055em; text-underline-offset:.12em; }

    @media (max-width:760px) {
      .breath-hero { height:170svh; }
      .breath-hero__stage { align-items:end; }
      .breath-hero__stage > img { object-position:38% center; }
      .breath-hero__stage > .breath-hero__image--release { object-position:42% center; }
      .breath-hero__stage::after { position:absolute; z-index:-1; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.72),transparent 55%); content:""; }
      .breath-hero__copy { width:auto; align-self:end; margin:0; padding:0 24px 56px; }
      .breath-hero__line { max-width:520px; font-size:clamp(42px,11.5vw,60px); }
    }

    @media (prefers-reduced-motion:reduce) {
      .breath-hero { height:100svh; }
      .breath-hero__stage > img { transform:none; }
      .breath-hero__image--ready { display:none; }
      .breath-hero__image--release { opacity:1; }
      .breath-hero__line:first-child { display:none; }
      .breath-hero__line:last-child { opacity:1; transform:none; }
    }
  </style>
</head>
<body>
  <header class="breath-hero" data-breath-hero>
    <div class="breath-hero__stage">
      <img class="breath-hero__image--ready" src="assets/held-breath-header-v4.webp" alt="A man holding his breath with his cheeks inflated" width="1774" height="887" loading="eager" fetchpriority="high" decoding="async">
      <img class="breath-hero__image--release" src="assets/held-breath-release.webp" alt="The same man looking calmly toward the camera after releasing his breath" width="1448" height="1086" decoding="async">
      <div class="breath-hero__copy">
        <h1>
          <span class="breath-hero__line">Ready?</span>
          <span class="breath-hero__line">The doctor can see <span class="breath-hero__emphasis">you</span> now.</span>
        </h1>
      </div>
    </div>
  </header>
  <script>
    (() => {
      const hero = document.querySelector('[data-breath-hero]');
      if (!hero || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let frame = 0;
      const render = () => {
        const rect = hero.getBoundingClientRect();
        const distance = Math.max(1,hero.offsetHeight - innerHeight);
        const progress = Math.min(1,Math.max(0,-rect.top / distance));
        hero.style.setProperty('--hero-progress',progress.toFixed(4));
        frame = 0;
      };
      const requestRender = () => { if (!frame) frame = requestAnimationFrame(render); };
      addEventListener('scroll',requestRender,{ passive:true });
      addEventListener('resize',requestRender);
      render();
    })();
  </script>
</body>
</html>
