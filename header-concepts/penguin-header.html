<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>n1.care — Header concept 03</title>
  <meta name="description" content="A lifetime of health brought into view for the clinical conversation.">
  <link rel="preload" as="image" href="assets/penguin-search-first.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/penguin-search-red-v2.webp">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/inter-400.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/inter-700.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: only light;
      font-family: "Inter", Arial, sans-serif;
      background: #dfe8ed;
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; margin: 0; }

    body { background: #dfe8ed; }

    .search-hero {
      height: 220svh;
      position: relative;
      background: #dfe8ed;
    }

    .search-hero__stage {
      height: 100svh;
      position: sticky;
      top: 0;
      display: grid;
      align-items: start;
      overflow: hidden;
      isolation: isolate;
    }

    .search-hero__stage > img {
      width: 100%;
      height: 100%;
      position: absolute;
      z-index: -2;
      inset: 0;
      object-fit: cover;
      object-position: center 60%;
      filter: saturate(.94) contrast(.99) brightness(1.01);
      transform: scale(calc(1 + var(--hero-progress, 0) * .004));
      transform-origin: 42% 72%;
      will-change: transform;
    }

    .search-hero__image--search { opacity:1; }
    .search-hero__image--doctor {
      opacity:clamp(0,calc((var(--hero-progress,0) - .24) * 3.2),1);
      object-position:center 60%;
      -webkit-mask-image:radial-gradient(ellipse 4.2% 9% at var(--reveal-x,34%) 62%,#000 0 62%,rgba(0,0,0,.9) 72%,transparent 100%);
      mask-image:radial-gradient(ellipse 4.2% 9% at var(--reveal-x,34%) 62%,#000 0 62%,rgba(0,0,0,.9) 72%,transparent 100%);
    }

    .search-hero__stage::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(14,29,32,.035), transparent 42%, rgba(14,29,32,.055));
      content: "";
    }

    .search-hero__copy {
      width: min(560px, 40vw);
      position: relative;
      align-self: start;
      margin-top: clamp(64px, 8vh, 96px);
      margin-right: auto;
      margin-left: clamp(52px, 6.5vw, 116px);
      color: #102a31;
      text-align: left;
      text-shadow: 0 1px 0 rgba(255,255,255,.12);
    }

    .search-hero__copy h1 {
      display: grid;
      margin: 0;
      font: inherit;
    }

    .search-hero__line {
      max-width: 540px;
      margin: 0;
      grid-column: 1;
      grid-row: 1;
      font-size: clamp(44px, 4.5vw, 76px);
      font-weight: 700;
      line-height: .94;
      letter-spacing: -.062em;
      text-wrap: balance;
      will-change: opacity, transform;
    }

    .search-hero__line--search {
      opacity: calc(1 - min(1, var(--hero-progress, 0) * 2.55));
      transform: translateY(calc(var(--hero-progress, 0) * -18px));
    }

    .search-hero__line--doctor {
      opacity: clamp(0, calc((var(--hero-progress, 0) - .46) * 3.2), 1);
      transform: translateY(calc((1 - clamp(0, calc((var(--hero-progress, 0) - .46) * 3.2), 1)) * 18px));
    }

    .search-hero__detail {
      display:block;
      margin-top:clamp(18px,2.5vh,30px);
      font-size:clamp(21px,2vw,32px);
      font-weight:400;
      line-height:1.08;
      letter-spacing:-.038em;
      opacity:clamp(0,calc((var(--hero-progress,0) - .72) * 4),1);
      transform:translateY(calc((1 - clamp(0,calc((var(--hero-progress,0) - .72) * 4),1)) * 14px));
    }

    .search-hero__detail strong {
      display:block;
      font-size:clamp(27px,2.65vw,42px);
      font-weight:600;
      line-height:1;
      white-space:nowrap;
    }

    .search-hero__detail span { display:block; margin-top:5px; }

    @media (min-width: 761px) and (max-width: 1500px) {
      .search-hero__copy {
        width:min(470px,39vw);
        margin-top:clamp(52px,7vh,78px);
        margin-right:auto;
        margin-left:clamp(38px,5vw,72px);
      }

      .search-hero__line {
        font-size:clamp(40px,4.25vw,64px);
      }
    }

    @media (max-width: 760px) {
      .search-hero {
        height: 205svh;
      }

      .search-hero__stage { align-items: end; }

      .search-hero__stage > img { object-fit: cover; object-position: 42% 64%; transform:scale(calc(1 + var(--hero-progress,0) * .006)); }
      .search-hero__stage > .search-hero__image--doctor { --reveal-x:20%; object-position:42% 64%; }

      .search-hero__stage::after {
        background: linear-gradient(0deg, rgba(14,29,32,.86) 0%, rgba(14,29,32,.48) 33%, transparent 67%);
      }

      .search-hero__copy {
        width: auto;
        align-self: end;
        margin: 0;
        padding: 0 24px 56px;
        color:#f3ede2;
      }

      .search-hero__line {
        max-width: 520px;
        font-size:clamp(44px,12vw,64px);
      }

      .search-hero__detail { font-size:clamp(20px,5.6vw,27px); }
      .search-hero__detail strong { font-size:clamp(23px,6.5vw,30px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .search-hero { height: 100svh; }
      .search-hero__stage > img { transform: none; }
      .search-hero__image--doctor { opacity:1; }
      .search-hero__line--search { display: none; }
      .search-hero__line--doctor,.search-hero__detail { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <header class="search-hero" data-search-hero>
    <div class="search-hero__stage">
      <img class="search-hero__image--search" src="assets/penguin-search-first.webp" alt="A vast emperor penguin colony in a bright Antarctic landscape" width="1448" height="1086" loading="eager" fetchpriority="high" decoding="async">
      <img class="search-hero__image--doctor" src="assets/penguin-search-red-v2.webp" alt="The same emperor penguin colony with one penguin revealed in a red-and-white striped sweater" width="1448" height="1086" decoding="async">
      <div class="search-hero__copy">
        <h1>
          <span class="search-hero__line search-hero__line--search">We're in there somewhere.</span>
          <span class="search-hero__line search-hero__line--doctor">Found.<span class="search-hero__detail"><strong>The whole health story,</strong><span>in one view.</span></span></span>
        </h1>
      </div>
    </div>
  </header>
  <script>
    (() => {
      const hero = document.querySelector('[data-search-hero]');
      if (!hero || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      let frame = 0;
      const render = () => {
        const rect = hero.getBoundingClientRect();
        const distance = Math.max(1, hero.offsetHeight - innerHeight);
        const progress = Math.min(1, Math.max(0, -rect.top / distance));
        hero.style.setProperty('--hero-progress', progress.toFixed(4));
        frame = 0;
      };

      const requestRender = () => {
        if (!frame) frame = requestAnimationFrame(render);
      };

      addEventListener('scroll', requestRender, { passive: true });
      addEventListener('resize', requestRender);
      render();
    })();
  </script>
</body>
</html>
