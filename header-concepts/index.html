<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>n1.care — Header concepts</title>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/inter-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/inter-600.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: #173d3a;
      background: #f3ede2;
      font-family: "Inter", Arial, sans-serif;
    }

    .concept-review {
      height: 100%;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
    }

    .concept-review__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(23,61,58,.18);
      background: rgba(243,237,226,.96);
    }

    .concept-review__title,
    .concept-review__meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .concept-review__title b { font-size: 14px; }

    .concept-review__title span,
    .concept-review__meta span {
      color: #64736f;
      font-size: 11px;
    }

    .concept-review__number {
      min-width: 34px;
      min-height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #f3ede2;
      background: #173d3a;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .concept-review__nav {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid rgba(23,61,58,.18);
      border-radius: 9px;
      background: rgba(255,255,255,.36);
    }

    .concept-review__nav button {
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      color: #52625e;
      background: transparent;
      font: 600 11px/1 "Inter",Arial,sans-serif;
      cursor: pointer;
    }

    .concept-review__nav button[aria-pressed="true"] { color: #f3ede2; background: #173d3a; }

    .concept-review__open {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid #173d3a;
      border-radius: 7px;
      color: #173d3a;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
    }

    .concept-review__frame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #dfe8ed;
    }

    @media (max-width: 640px) {
      .concept-review__bar { padding: 0 12px; }
      .concept-review__title span,
      .concept-review__meta span { display: none; }
      .concept-review__title b { display: none; }
      .concept-review__nav button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <main class="concept-review">
    <header class="concept-review__bar">
      <div class="concept-review__title">
        <span class="concept-review__number" data-concept-number>01</span>
        <b data-concept-title>Held breath</b>
        <span>Homepage header concept</span>
      </div>
      <nav class="concept-review__nav" aria-label="Header concepts">
        <button type="button" aria-pressed="true" data-concept-src="breath-header.html?v=release-final" data-concept-number="01" data-concept-title="Held breath">01 Breath</button>
        <button type="button" aria-pressed="false" data-concept-src="maybe-header.html" data-concept-number="02" data-concept-title="No more maybe">02 Maybe</button>
        <button type="button" aria-pressed="false" data-concept-src="penguin-header.html" data-concept-number="03" data-concept-title="Penguin colony">03 Penguin</button>
        <button type="button" aria-pressed="false" data-concept-src="exam-header.html" data-concept-number="04" data-concept-title="Where did this come from">04 Exam</button>
        <button type="button" aria-pressed="false" data-concept-src="whole-picture-header.html" data-concept-number="05" data-concept-title="The whole picture">05 Picture</button>
      </nav>
      <div class="concept-review__meta">
        <span>Scroll inside the preview to reveal the payoff</span>
        <a class="concept-review__open" href="breath-header.html?v=release-final" target="_blank" rel="noopener" data-concept-open>Open full screen ↗</a>
      </div>
    </header>
    <iframe class="concept-review__frame" src="breath-header.html?v=release-final" title="Concept 01: Held breath header" data-concept-frame></iframe>
  </main>
  <script>
    (() => {
      const frame = document.querySelector('[data-concept-frame]');
      const number = document.querySelector('[data-concept-number]:not(button)');
      const title = document.querySelector('[data-concept-title]:not(button)');
      const open = document.querySelector('[data-concept-open]');
      const buttons = [...document.querySelectorAll('[data-concept-src]')];

      buttons.forEach((button) => button.addEventListener('click', () => {
        const src = button.dataset.conceptSrc;
        const conceptNumber = button.dataset.conceptNumber;
        const conceptTitle = button.dataset.conceptTitle;
        buttons.forEach((item) => item.setAttribute('aria-pressed',String(item === button)));
        frame.src = src;
        frame.title = `Concept ${conceptNumber}: ${conceptTitle} header`;
        number.textContent = conceptNumber;
        title.textContent = conceptTitle;
        open.href = src;
      }));
    })();
  </script>
</body>
</html>
